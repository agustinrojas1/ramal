# Postgres for the walkthrough, on its own port (5436) so it does not clash with the one the test suite uses (5435).
#
#     docker compose -f demo/docker-compose.yml up -d
#     docker compose -f demo/docker-compose.yml down -v     # when you are done
services:
  db:
    image: postgres:16
    container_name: ramal-demo-db
    environment:
      POSTGRES_USER: ramal
      POSTGRES_PASSWORD: ramal
      POSTGRES_DB: ramal_demo
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramal -d ramal_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
