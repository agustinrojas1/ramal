\* FixPending off, checking only OverlayMatchesLog: an action that fails after another wrote the same row takes the newer write out of the overlay but not out of the log.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxWrites = 1
    MaxExternal = 1
    MaxKills = 1
    FixPending = FALSE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 0
    MergerCrashes = 0
    Durable = FALSE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
INVARIANTS OverlayMatchesLog
CHECK_DEADLOCK FALSE
