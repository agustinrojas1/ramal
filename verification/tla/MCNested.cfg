\* A nested fork merging into its parent, with the version check and the parent remembering the forks it took. Every property holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    MaxActs = 5
    FixVersion = TRUE
    FixMerged = TRUE
    FixReconcile = TRUE
SYMMETRY Symmetry
INVARIANTS TypeOK NoDoubleNestedMerge ParentGetsChildWritesOnce NoLostParentWrite
PROPERTIES MergedStaysMerged
CHECK_DEADLOCK FALSE
