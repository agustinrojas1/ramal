\* Actions that write several rows (a bulk action, the hooks of an action, ADR 0036) in a durable branch (ADR 0048), with the whole lifecycle: up to two writes per action, here both on the one row, so a nested action that fails takes back a write the outer action's earlier write must survive; fork, proposal, merge, compaction and a node restart. No outside writes, heap kill or dying merger (MC.cfg has them). Every property holds, NoTornAction included.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxWrites = 2
    MaxExternal = 0
    MaxKills = 0
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 1
    MergerCrashes = 0
    Durable = TRUE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
INVARIANTS TypeOK MergeOnce OneMerger NoPhantomWrite NoLostWrite OverlayMatchesLog CommitIsFinal NoTornAction DurableAcked RecoveredMatchesLog NoHeldPersisted
PROPERTIES StatusMonotonic NoClaimAfterCommit
CHECK_DEADLOCK FALSE
