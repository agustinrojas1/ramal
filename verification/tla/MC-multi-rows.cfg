\* Actions that write two rows (a bulk action, the hooks of an action, ADR 0036) in a durable branch (ADR 0048), with the lifecycle left out (ProcessOnly: no fork, proposal or merge; MC-multi.cfg has them on one row). Two rows, so a second action can end between the two writes of the first and a nested action can take one back; a node restart. Every property holds, NoTornAction included: a restart finds an action's writes whole or not at all.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1, k2}
    Root = root
    Fork = fork
    MaxActs = 3
    MaxWrites = 2
    MaxExternal = 0
    MaxKills = 0
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 1
    MergerCrashes = 0
    Durable = TRUE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
CONSTRAINT ProcessOnly
INVARIANTS TypeOK OverlayMatchesLog NoPhantomWrite NoTornAction DurableAcked RecoveredMatchesLog NoHeldPersisted
CHECK_DEADLOCK FALSE
