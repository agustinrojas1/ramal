\* FixUndoOrder off, checking only OverlayMatchesLog: an action writes the same row twice (a hook that writes a row its own action wrote, or two records of a bulk action) and then fails or dies; its writes go back oldest first, so the overlay keeps the first write while the log holds none.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 1
    MaxWrites = 2
    MaxExternal = 0
    MaxKills = 0
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 0
    MergerCrashes = 0
    Durable = FALSE
    DurableOnWrite = FALSE
    FixUndoOrder = FALSE
SYMMETRY Symmetry
INVARIANTS OverlayMatchesLog
CHECK_DEADLOCK FALSE
