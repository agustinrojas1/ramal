\* The epoch guard off: a process that lost the branch saves what it holds over what the other saved, and a write a caller was told succeeded is gone without a trace (NoLostUpdateUnreported).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    MaxWrites = 3
    MaxLoads = 4
    MaxSplits = 2
    MaxCrashes = 1
    FixFence = FALSE
INVARIANTS TypeOK OneOwner NoLostUpdateUnreported
CHECK_DEADLOCK FALSE
