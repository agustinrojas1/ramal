\* The fixed code, with a node restart or a merger that dies after its commit (one of the two per run). Every property holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxExternal = 1
    MaxKills = 1
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 1
    MergerCrashes = 1
SYMMETRY Symmetry
INVARIANTS TypeOK MergeOnce OneMerger NoPhantomWrite NoLostWrite OverlayMatchesLog CommitIsFinal
PROPERTIES StatusMonotonic NoClaimAfterCommit
CHECK_DEADLOCK FALSE
