\* Durable branches (ADR 0048): the write log is appended when an action ends, and a node restart loads the snapshot with the log applied. Two rows, so two actions of one branch can run at once and end in either order; no outside writes, no heap kill and no merger that dies, which durability does not touch (MC.cfg has them). Every property holds, DurableAcked, RecoveredMatchesLog and NoHeldPersisted included.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1, k2}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxWrites = 1
    MaxExternal = 0
    MaxKills = 0
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 1
    MergerCrashes = 0
    Durable = TRUE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
INVARIANTS TypeOK MergeOnce OneMerger NoPhantomWrite NoLostWrite OverlayMatchesLog CommitIsFinal NoTornAction DurableAcked RecoveredMatchesLog NoHeldPersisted
PROPERTIES StatusMonotonic NoClaimAfterCommit
CHECK_DEADLOCK FALSE
