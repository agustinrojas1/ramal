\* FixPending off with two writes per action, checking only NoTornAction: a fork, a proposal or a merge takes the first write of an action that is still running and not the second, so the copy holds half of an action.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxWrites = 2
    MaxExternal = 0
    MaxKills = 0
    FixPending = FALSE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 0
    MergerCrashes = 0
    Durable = FALSE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
INVARIANTS NoTornAction
CHECK_DEADLOCK FALSE
