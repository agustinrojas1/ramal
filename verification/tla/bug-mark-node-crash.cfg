\* FixMergedMark off (ADR 0023 before ADR 0035): the node restarts between the commit of a merge and the persist of the merged branch, which is open again in storage and is merged again (NoClaimAfterCommit, MergeOnce).
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxWrites = 1
    MaxExternal = 1
    MaxKills = 1
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = FALSE
    NodeCrashes = 1
    MergerCrashes = 0
    Durable = FALSE
    DurableOnWrite = FALSE
    FixUndoOrder = TRUE
SYMMETRY Symmetry
INVARIANTS TypeOK MergeOnce OneMerger NoPhantomWrite NoLostWrite OverlayMatchesLog CommitIsFinal
PROPERTIES StatusMonotonic NoClaimAfterCommit
CHECK_DEADLOCK FALSE
