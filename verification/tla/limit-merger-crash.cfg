    Root = root
    Fork = fork
    MaxActs = 2
    MaxExternal = 1
    MaxKills = 1
    FixPending = TRUE
    FixMarker = TRUE
    NodeCrashes = 0
    MergerCrashes = 1
SYMMETRY Symmetry
INVARIANTS TypeOK MergeOnce OneMerger NoPhantomWrite NoLostWrite OverlayMatchesLog CommitIsFinal
PROPERTIES StatusMonotonic NoClaimAfterCommit
CHECK_DEADLOCK FALSE
