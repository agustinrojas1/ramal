\* FixReconcile off: a fork whose merger died after the parent took its work stays open and takes writes the parent never gets (ParentGetsChildWritesOnce).
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    MaxActs = 5
    FixVersion = TRUE
    FixMerged = TRUE
    FixReconcile = FALSE
SYMMETRY Symmetry
INVARIANTS TypeOK NoDoubleNestedMerge ParentGetsChildWritesOnce NoLostParentWrite
PROPERTIES MergedStaysMerged
CHECK_DEADLOCK FALSE
