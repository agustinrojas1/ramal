\* Durable branches in a cluster (ADR 0048, ADR 0044): a write is appended to the storage's log, on the epoch of the process, before it is acknowledged, and a load reads the log after its claim. Three nodes, a split and a heal, a node crash. Every property holds, DurableAcked and SingleLogWriter included.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 3
    MaxLoads = 5
    MaxSplits = 2
    MaxCrashes = 1
    FixFence = TRUE
    Durable = TRUE
    FixAppendFence = TRUE
INVARIANTS TypeOK OneOwner NoLostUpdateUnreported DurableAcked
PROPERTIES SingleWriter SingleLogWriter
CHECK_DEADLOCK FALSE
