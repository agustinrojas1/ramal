\* Durable with the write log appended on every write instead of when the action ends (DurableOnWrite): TLC finds a log that holds a write of an action that has not ended, which the action may still take back (NoHeldPersisted).
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    Root = root
    Fork = fork
    MaxActs = 2
    MaxExternal = 1
    MaxKills = 1
    FixPending = TRUE
    FixMarker = TRUE
    FixMergedMark = TRUE
    NodeCrashes = 1
    MergerCrashes = 0
    Durable = TRUE
    DurableOnWrite = TRUE
SYMMETRY Symmetry
INVARIANTS NoHeldPersisted
CHECK_DEADLOCK FALSE
