\* Durable with the append not conditional on the epoch: a process that another load replaced stores and acknowledges a write the new holder never reads, and the storage's log grows by a process that does not hold its epoch (SingleLogWriter).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    MaxWrites = 3
    MaxLoads = 3
    MaxSplits = 1
    MaxCrashes = 1
    FixFence = TRUE
    Durable = TRUE
    FixAppendFence = FALSE
PROPERTIES SingleLogWriter
CHECK_DEADLOCK FALSE
