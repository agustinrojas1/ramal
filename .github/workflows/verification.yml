name: Verification

# The formal models under verification/: the TLA+ models of the branch lifecycle and of a branch in a cluster, checked with TLC, and the Bend proofs
# of the overlay and merge rules. Runs when they or the code they model change. The `paths` below are checked against
# verification/model_map.exs by test/ramal/model_map_test.exs, so a file a model reads cannot be left out (ADR 0050).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "verification/**"
      - "lib/ramal.ex"
      - "lib/ramal/overlay.ex"
      - "lib/ramal/branch.ex"
      - "lib/ramal/branch/server.ex"
      - "lib/ramal/capture.ex"
      - "lib/ramal/merge.ex"
      - "lib/ramal/cluster.ex"
      - "lib/ramal/storage.ex"
      - "lib/ramal/storage/ets.ex"
      - "lib/ramal/storage/postgres.ex"
      - "lib/ramal/supervisor.ex"
      - ".github/workflows/verification.yml"

# Nothing in CI writes to the repository, so the token can only read it.
permissions:
  contents: read

jobs:
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships a JDK, which is all TLC needs.
      - name: Install TLC 2.19 (tla2tools v1.7.4)
        run: |
          mkdir -p verification/.tools
          curl -fsSL -o verification/.tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  verification/.tools/tla2tools.jar" | sha256sum -c -
      - name: Model-check
        run: verification/check.sh tla

  bend:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bend 2.0.38
        run: |
          name=bend-2.0.38-linux-x64.tar.gz
          curl -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v2.0.38/$name"
          echo "f19d088b079c9e1a8834ecd153b7d58c11a5f8f9ab1bdb78dbc96a6bf49aaa81  /tmp/$name" | sha256sum -c -
          mkdir -p "$HOME/.bend/bin" && tar -xzf "/tmp/$name" -C /tmp
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      # --verdict checks the proofs again with BendTT, Bend's kernel proved in Lean; it builds the kernel with Lean.
      - name: Install Lean 4.34.0 for the BendTT kernel
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the proofs
        run: verification/check.sh bend
        env:
          BEND_FLAGS: --verdict
