name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ramal
          POSTGRES_PASSWORD: ramal
          POSTGRES_DB: ramal_test
        ports: ["5435:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      # Fails on a retired package or a published security advisory in mix.lock.
      - run: mix hex.audit
      - run: mix ci
      - run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

  # Compiles the benchmark and runs its smallest profile, so that it cannot rot. No timing is asserted or recorded.
  bench-smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ramal
          POSTGRES_PASSWORD: ramal
          POSTGRES_DB: ramal_bench
        ports: ["5435:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            bench/deps
            bench/_build
          key: ${{ runner.os }}-bench-${{ hashFiles('bench/mix.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix bench --quick --no-json

  # The AshAi example is its own Mix project and pins one ash_ai version. It runs on the ETS data layer.
  ash-ai-example:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: examples/ash_ai
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            examples/ash_ai/deps
            examples/ash_ai/_build
          key: ${{ runner.os }}-ash-ai-example-${{ hashFiles('examples/ash_ai/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-ash-ai-example-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix ci

  # The inspector is its own Mix project. Its suite runs on the ETS data layer, so it needs no database.
  ramal-live:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: ramal_live
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            ramal_live/deps
            ramal_live/_build
          key: ${{ runner.os }}-ramal-live-${{ hashFiles('ramal_live/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-ramal-live-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix ci
