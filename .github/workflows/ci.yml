name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ramal
          POSTGRES_PASSWORD: ramal
          POSTGRES_DB: ramal_test
        ports: ["5435:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      # Fails on a retired package or a published security advisory in mix.lock.
      - run: mix hex.audit
      - run: mix ci
      - run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

  # Tests against other Ash versions than the locked one. The next Ash minor should break this job before it breaks a
  # user, so each leg resolves the newest versions its requirement allows (the unlock below), and the Ash main leg
  # may fail without failing the workflow. RAMAL_ASH_VERSION is read by mix.exs; the `ci` job above stays on the lock.
  ash-matrix:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ramal
          POSTGRES_PASSWORD: ramal
          POSTGRES_DB: ramal_test
        ports: ["5435:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      RAMAL_ASH_VERSION: ${{ matrix.requirement }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "3.36", requirement: "~> 3.36.0", experimental: false}
          - {name: "3.37", requirement: "~> 3.37.0", experimental: false}
          - {name: "latest 3.x", requirement: "~> 3.36", experimental: false}
          - {name: "main", requirement: "main", experimental: true}
    continue-on-error: ${{ matrix.experimental }}
    name: ash ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-ash-${{ matrix.name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-ash-${{ matrix.name }}-
      - run: mix deps.unlock ash ash_postgres ash_sql spark reactor splode && mix deps.get
      - name: Print the resolved Ash versions
        run: mix deps | grep -A1 -E '^\* (ash|ash_postgres|ash_sql|spark) '
      - run: mix compile
      - run: mix test

  # Compiles the benchmark and runs its smallest profile, so that it cannot rot. No timing is asserted or recorded.
  bench-smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ramal
          POSTGRES_PASSWORD: ramal
          POSTGRES_DB: ramal_bench
        ports: ["5435:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            bench/deps
            bench/_build
          key: ${{ runner.os }}-bench-${{ hashFiles('bench/mix.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix bench --quick --no-json

  # The AshAi example is its own Mix project and pins one ash_ai version. It runs on the ETS data layer.
  ash-ai-example:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: examples/ash_ai
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            examples/ash_ai/deps
            examples/ash_ai/_build
          key: ${{ runner.os }}-ash-ai-example-${{ hashFiles('examples/ash_ai/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-ash-ai-example-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix ci

  # The inspector is its own Mix project. Its suite runs on the ETS data layer, so it needs no database.
  ramal-live:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: ramal_live
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.6"
      - uses: actions/cache@v6
        with:
          path: |
            ramal_live/deps
            ramal_live/_build
          key: ${{ runner.os }}-ramal-live-${{ hashFiles('ramal_live/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-ramal-live-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix ci
