version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Ash, AshPostgres and Spark are locked to the minor series in CLAUDE.md; a minor bump is a deliberate PR.
    ignore:
      - dependency-name: ash
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: ash_postgres
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: spark
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: mix
    directory: /bench
    schedule:
      interval: weekly

  - package-ecosystem: mix
    directory: /ramal_live
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
